[project]
name = "pizzAI"
version = "0.1.0"
description = "Agente de voz en tiempo real para tomar pedidos telefónicos de pizzería"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# PyAudioWPatch es específico de Windows (WASAPI) - solo hace falta para
# correr LocalAudioIO en local. domain/ y agents/ (y sus tests) no lo tocan,
# por eso no está en las dependencias base: así CI y Docker (Linux) instalan
# y testean sin fallar en plataformas donde este paquete no existe.
audio-windows = [
    "PyAudioWPatch>=0.2.12.8; sys_platform == 'win32'",
]
# Servidor de telefonía real (Twilio Media Streams). audioop-lts porque el
# módulo audioop se quitó de la stdlib en Python 3.13+ (lo usa audio/codecs.py
# para la conversión mu-law<->PCM); en 3.11/3.12 ya viene en la stdlib, de
# ahí el marcador de versión.
twilio = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "twilio>=9.0",
    "python-multipart>=0.0.9",  # Starlette lo necesita para parsear el POST form-urlencoded de Twilio
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# RAG de FAQ/políticas del restaurante (rag/). Módulo aislado: no lo usa
# ni server.py ni agents/tools.py todavía, por eso no está en las
# dependencias base - así el bot de voz sigue instalándose sin arrastrar
# todo LangChain si no hace falta.
rag = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-chroma>=0.2",
    "pypdf>=5.0",
]

[project.scripts]
pizzai = "pizzeria_bot.main:run"
pizzai-call = "pizzeria_bot.outbound_call:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pizzeria_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
