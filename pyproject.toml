[project]
name = "pizzAI"
version = "0.1.0"
description = "Agente de voz en tiempo real para tomar pedidos telefónicos de pizzería"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# PyAudioWPatch es específico de Windows (WASAPI) - solo hace falta para
# correr LocalAudioIO en local. domain/ y agents/ (y sus tests) no lo tocan,
# por eso no está en las dependencias base: así CI y Docker (Linux) instalan
# y testean sin fallar en plataformas donde este paquete no existe.
audio-windows = [
    "PyAudioWPatch>=0.2.12.8; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pizzai = "pizzeria_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pizzeria_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
